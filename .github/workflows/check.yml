name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: "26.0"
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Install dependencies
        run: mise exec -- pnpm install --frozen-lockfile
      - name: Build frontend
        run: mise exec -- pnpm build
      - name: Test on Apple Silicon
        run: mise exec -- cargo test --manifest-path src-tauri/Cargo.toml --locked --target aarch64-apple-darwin
      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked --target aarch64-apple-darwin -- -D warnings
      - name: Check generated types are current
        # ts-rs can emit trailing spaces before field documentation.
        run: git diff --ignore-space-at-eol --exit-code -- src/bindings
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Install dependencies
        run: mise exec -- pnpm install --frozen-lockfile
      - name: Frontend checks
        run: mise exec -- pnpm check
      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Rust tests and generated types
        run: mise exec -- cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Check generated types are current
        # ts-rs can emit trailing spaces before field documentation.
        run: git diff --ignore-space-at-eol --exit-code -- src/bindings
      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Stage bundled runtime
        run: mise exec -- pnpm runtime:stage
      - name: Build desktop executable
        run: mise exec -- pnpm tauri build --debug --no-bundle --config src-tauri/tauri.runtime.conf.json
      - name: Check bundled runtime without developer tools
        shell: pwsh
        run: |
          $env:PATH = "$env:WINDIR\System32;$env:WINDIR"
          & .\src-tauri\target\debug\tanzakoo.exe --connection-check codex "$env:RUNNER_TEMP\tanzakoo-connection-check"
