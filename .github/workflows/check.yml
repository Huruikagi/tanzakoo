name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  review-relay-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build review relay image
        run: docker build -f packages/review-relay/Dockerfile -t tanzakoo-review-relay:check .
      - name: Check volume guards and live SQLite backup (offline)
        run: >-
          docker run --rm --network none
          -v "$PWD/packages/review-relay/test:/app/test:ro"
          --entrypoint node tanzakoo-review-relay:check
          --test test/deployment.test.mjs
      - name: Check container startup, persistent volume and graceful restart (offline)
        run: bash scripts/review-container-smoke.sh tanzakoo-review-relay:check
  macos:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: "26.0"
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Install dependencies
        run: mise exec -- pnpm install --frozen-lockfile
      - name: Build frontend
        run: mise exec -- pnpm build
      - name: Store provisioning validation and script syntax (no credentials)
        run: |
          python3 -m unittest discover -s scripts -p 'test_macos_*.py'
          mise exec -- node --test scripts/macos-capture-window.test.mjs
          bash -n scripts/package-macos-store.sh
      - name: Reference runtime policy (offline)
        run: mise exec -- pnpm test:runtime
      - name: Test on Apple Silicon
        run: mise exec -- cargo test --manifest-path src-tauri/Cargo.toml --locked --features chatgpt-plan-preview --target aarch64-apple-darwin
      - name: ChatGPT plan authentication (offline)
        run: mise exec -- pnpm test:plan
      - name: Review relay and real ACP/MCP (offline, not App Sandbox)
        run: mise exec -- pnpm test:review
      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked --target aarch64-apple-darwin -- -D warnings
      - name: Check generated types are current
        # ts-rs can emit trailing spaces before field documentation.
        run: git diff --ignore-space-at-eol --exit-code -- src/bindings
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Install dependencies
        run: mise exec -- pnpm install --frozen-lockfile
      - name: Frontend checks
        run: mise exec -- pnpm check
      - name: Reference runtime policy (offline)
        run: mise exec -- pnpm test:runtime
      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Rust tests and generated types
        run: mise exec -- cargo test --manifest-path src-tauri/Cargo.toml --locked --features chatgpt-plan-preview
      - name: ChatGPT plan authentication (offline)
        run: mise exec -- pnpm test:plan
      - name: Review relay and real ACP/MCP (offline)
        run: mise exec -- pnpm test:review
      - name: Check generated types are current
        # ts-rs can emit trailing spaces before field documentation.
        run: git diff --ignore-space-at-eol --exit-code -- src/bindings
      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Stage bundled runtime
        run: mise exec -- pnpm runtime:stage
      - name: Build desktop executable
        run: mise exec -- pnpm tauri build --debug --no-bundle --config src-tauri/tauri.runtime.conf.json
      - name: Check bundled runtime without developer tools
        shell: pwsh
        run: |
          $env:PATH = "$env:WINDIR\System32;$env:WINDIR"
          & .\src-tauri\target\debug\tanzakoo.exe --connection-check codex "$env:RUNNER_TEMP\tanzakoo-connection-check"
