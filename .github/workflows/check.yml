name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Install dependencies
        run: mise exec -- pnpm install --frozen-lockfile
      - name: Frontend checks
        run: mise exec -- pnpm check
      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Rust tests and generated types
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Check generated types are current
        run: git diff --exit-code -- src/bindings
      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Build desktop executable
        run: mise exec -- pnpm tauri build --debug --no-bundle
