name: macOS signed DMG

on:
  workflow_dispatch:
    inputs:
      review_access:
        description: Include the Tanzakoo review relay connection
        type: boolean
        default: false
        required: true
      sandbox:
        description: Build the separate App Sandbox verification app
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: macos-dmg-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dmg:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: "26.0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
      - name: Check Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Install dependencies
        run: mise exec -- pnpm install --frozen-lockfile
      - name: Identify Rust toolchain
        id: rust-version
        run: echo "fingerprint=$(rustc -vV | shasum -a 256 | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Restore unsigned Rust build cache
        id: rust-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: src-tauri/target
          key: dmg-macos-26-arm64-${{ inputs.sandbox }}-${{ steps.rust-version.outputs.fingerprint }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml', 'src-tauri/build.rs', 'src-tauri/src/**/*.rs') }}
          restore-keys: |
            dmg-macos-26-arm64-${{ inputs.sandbox }}-${{ steps.rust-version.outputs.fingerprint }}-
            dmg-macos-26-arm64-${{ steps.rust-version.outputs.fingerprint }}-
      - name: Frontend checks
        run: mise exec -- pnpm check
      - name: Rust tests
        run: mise exec -- cargo test --manifest-path src-tauri/Cargo.toml --locked --target aarch64-apple-darwin
      - name: Check generated types are current
        # ts-rs can emit trailing spaces before field documentation.
        run: git diff --ignore-space-at-eol --exit-code -- src/bindings
      - name: Sandbox bookmark failure cases
        if: inputs.sandbox
        run: mise exec -- cargo test --manifest-path src-tauri/Cargo.toml --locked --target aarch64-apple-darwin --features app-sandbox --lib materials::scope
      - name: Stage bundled runtime
        run: mise exec -- pnpm runtime:stage
      - name: Build application bundle
        env:
          TANZAKOO_REVIEW_URL: ${{ inputs.review_access && 'https://review-relay-production-4f29.up.railway.app' || '' }}
          SANDBOX: ${{ inputs.sandbox }}
        run: |
          configs=(--config src-tauri/tauri.runtime.conf.json --config src-tauri/tauri.dmg.conf.json)
          if [[ $SANDBOX == true ]]; then configs+=(--config src-tauri/tauri.sandbox.conf.json); fi
          mise exec -- pnpm tauri build --ci --no-sign \
            --target aarch64-apple-darwin --bundles app "${configs[@]}" -- --locked
      # Save before any signing credentials or signed files enter the job.
      - name: Save unsigned Rust build cache
        if: ${{ !cancelled() && steps.rust-cache.outcome == 'success' && steps.rust-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: src-tauri/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Sign, notarize and verify DMG
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          SANDBOX: ${{ inputs.sandbox }}
        run: |
          name=Tanzakoo
          if [[ $SANDBOX == true ]]; then name='Tanzakoo Sandbox'; fi
          bash scripts/package-macos.sh \
            "src-tauri/target/aarch64-apple-darwin/release/bundle/macos/$name.app" .local/macos-dist
      - name: Upload verified DMG
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Tanzakoo-macos-arm64-${{ github.sha }}-${{ inputs.review_access && 'review' || 'standard' }}${{ inputs.sandbox && '-sandbox' || '' }}
          path: |
            .local/macos-dist/*.dmg
            .local/macos-dist/*.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload notarization diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-notarization-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/macos-dist/*.json
          if-no-files-found: ignore
          retention-days: 14
