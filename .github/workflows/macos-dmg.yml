name: macOS signed DMG

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-dmg-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dmg:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: "26.0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
      - name: Check Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Install dependencies
        run: mise exec -- pnpm install --frozen-lockfile
      - name: Frontend checks
        run: mise exec -- pnpm check
      - name: Rust tests
        run: mise exec -- cargo test --manifest-path src-tauri/Cargo.toml --locked --target aarch64-apple-darwin
      - name: Check generated types are current
        run: git diff --exit-code -- src/bindings
      - name: Stage bundled runtime
        run: mise exec -- pnpm runtime:stage
      - name: Build application bundle
        run: >-
          mise exec -- pnpm tauri build --ci --no-sign
          --target aarch64-apple-darwin --bundles app
          --config src-tauri/tauri.runtime.conf.json
          --config src-tauri/tauri.dmg.conf.json -- --locked
      - name: Sign, notarize and verify DMG
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: >-
          bash scripts/package-macos.sh
          src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Tanzakoo.app
          .local/macos-dist
      - name: Upload verified DMG
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Tanzakoo-macos-arm64-${{ github.sha }}
          path: |
            .local/macos-dist/*.dmg
            .local/macos-dist/*.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload notarization diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-notarization-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/macos-dist/*.json
          if-no-files-found: ignore
          retention-days: 14
