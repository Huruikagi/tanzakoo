[package]
name = "tanzakoo"
version = "0.1.0"
license = "MIT"
edition = "2024"
rust-version = "1.88"
default-run = "tanzakoo"

[features]
app-sandbox = []
sandbox-validation = ["app-sandbox"]

[lib]
name = "tanzakoo_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = { version = "0.13.4", default-features = false }
rusqlite = { version = "0.38", features = ["bundled"] }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "process",
  "io-util",
  "io-std",
  "sync",
  "time",
  "macros",
] }
agent-client-protocol = "=2.2.0"
rmcp = { version = "=3.4.1", features = ["transport-io"] }
thiserror = "2"
tracing = "0.1"
ts-rs = { version = "12", features = ["serde-compat"] }
tauri-plugin-dialog = "2"
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2-user-notifications = { version = "0.3.2", default-features = false, features = [
  "std",
  "block2",
  "UNUserNotificationCenter",
  "UNNotification",
  "UNNotificationContent",
  "UNNotificationRequest",
  "UNNotificationResponse",
  "UNNotificationSettings",
  "UNNotificationSound",
  "UNNotificationTrigger",
] }
objc2 = "0.6.4"
libc = "0.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSArray",
  "NSString",
  "NSPathUtilities",
  "NSURL",
  "NSData",
  "NSError",
  "NSBundle",
] }

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8.1"
windows = { version = "0.62", features = [
  "UI_Notifications",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_Registry",
  "Win32_Security",
] }
